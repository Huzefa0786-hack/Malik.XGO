services:
  - type: web
    name: malik-xgo-backend
    runtime: node
    plan: free
    buildCommand: |
      cd server
      npm install
    startCommand: |
      cd server
      node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false